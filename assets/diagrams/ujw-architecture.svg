<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="ujwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#070d0b" />
      <stop offset="100%" stop-color="#040605" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091411" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050a08" stop-opacity="0.95" />
    </linearGradient>

    <filter id="mintGlowUjw" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowMint" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00ff9c" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00f7ff" />
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="960" height="560" fill="url(#ujwBg)" />
  <rect x="1" y="1" width="958" height="558" fill="none" stroke="rgba(0, 255, 156, 0.2)" stroke-width="1.5" />

  <!-- Top Title Strip -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="888" height="34" rx="4" fill="#08100d" stroke="rgba(0, 255, 156, 0.25)" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#00ff9c" />
    <text x="28" y="21" class="mono" font-size="11" font-weight="700" fill="#00ff9c" letter-spacing="0.1em">
      SYSTEM ARCHITECTURE · UNIQUE JERSEY WHOLESALE (MODULAR MONOLITH)
    </text>
    <text x="874" y="21" text-anchor="end" class="mono" font-size="10.5" fill="#8e9d97">
      LARAVEL 13 · REACT 19 · POSTGRESQL 18
    </text>
  </g>

  <!-- LAYER 1: CLIENT TIER (Top) -->
  <g transform="translate(36, 86)">
    <rect x="0" y="0" width="888" height="96" rx="6" fill="url(#panelGrad)" stroke="rgba(0, 255, 156, 0.2)" stroke-width="1" />
    <text x="16" y="22" class="mono" font-size="10" font-weight="700" fill="#00ff9c" letter-spacing="0.1em">
      01 · CLIENT TIER (INERTIA.JS SPA)
    </text>

    <!-- Sub-boxes for Portals -->
    <g transform="translate(16, 32)">
      <!-- Admin Portal -->
      <g>
        <rect x="0" y="0" width="268" height="50" rx="4" fill="#0c1d17" stroke="rgba(0, 255, 156, 0.3)" stroke-width="1" />
        <text x="12" y="20" class="mono" font-size="11" font-weight="700" fill="#edfdf6">Admin Portal (/admin)</text>
        <text x="12" y="38" class="sans" font-size="10" fill="#8e9d97">Review Orders · Allocations · Ledger</text>
      </g>
      <!-- Salesman Portal -->
      <g transform="translate(292, 0)">
        <rect x="0" y="0" width="268" height="50" rx="4" fill="#0c1d17" stroke="rgba(0, 255, 156, 0.3)" stroke-width="1" />
        <text x="12" y="20" class="mono" font-size="11" font-weight="700" fill="#edfdf6">Salesman Portal (/salesman)</text>
        <text x="12" y="38" class="sans" font-size="10" fill="#8e9d97">Catalog Browsing · Price Band Ordering</text>
      </g>
      <!-- Delivery Portal -->
      <g transform="translate(584, 0)">
        <rect x="0" y="0" width="272" height="50" rx="4" fill="#0c1d17" stroke="rgba(0, 255, 156, 0.3)" stroke-width="1" />
        <text x="12" y="20" class="mono" font-size="11" font-weight="700" fill="#edfdf6">Delivery Portal (/delivery)</text>
        <text x="12" y="38" class="sans" font-size="10" fill="#8e9d97">Dispatch Route · Proof of Delivery (PoD)</text>
      </g>
    </g>
  </g>

  <!-- Connectors from Client to Core -->
  <line x1="186" y1="182" x2="186" y2="216" stroke="#00ff9c" stroke-width="1.5" marker-end="url(#arrowMint)" />
  <line x1="478" y1="182" x2="478" y2="216" stroke="#00ff9c" stroke-width="1.5" marker-end="url(#arrowMint)" />
  <line x1="756" y1="182" x2="756" y2="216" stroke="#00ff9c" stroke-width="1.5" marker-end="url(#arrowMint)" />

  <!-- LAYER 2: APPLICATION CORE (Middle) -->
  <g transform="translate(36, 222)">
    <rect x="0" y="0" width="888" height="154" rx="6" fill="url(#panelGrad)" stroke="rgba(0, 247, 255, 0.25)" stroke-width="1" />
    <text x="16" y="22" class="mono" font-size="10" font-weight="700" fill="#00f7ff" letter-spacing="0.1em">
      02 · LARAVEL 13 MONOLITHIC APPLICATION CORE (PHP 8.5)
    </text>
    <text x="874" y="22" text-anchor="end" class="mono" font-size="9.5" fill="#8e9d97">
      RBAC · TRANSACTIONS · DOMAIN BOUNDARIES
    </text>

    <!-- Five Domain Modules -->
    <g transform="translate(16, 36)">
      <!-- Order Management -->
      <g>
        <rect x="0" y="0" width="162" height="98" rx="4" fill="#09161a" stroke="rgba(0, 247, 255, 0.3)" stroke-width="1" />
        <text x="10" y="20" class="mono" font-size="10.5" font-weight="700" fill="#00f7ff">Order Module</text>
        <text x="10" y="38" class="sans" font-size="9.5" fill="#edfdf6">Lifecycle States</text>
        <text x="10" y="54" class="sans" font-size="9" fill="#8e9d97">Draft → Approved</text>
        <text x="10" y="70" class="sans" font-size="9" fill="#8e9d97">Allocations Lock</text>
        <text x="10" y="86" class="mono" font-size="8.5" fill="#00ff9c">Atomic DB Lock</text>
      </g>
      <!-- Product Catalog & Pricing -->
      <g transform="translate(174, 0)">
        <rect x="0" y="0" width="162" height="98" rx="4" fill="#09161a" stroke="rgba(0, 247, 255, 0.3)" stroke-width="1" />
        <text x="10" y="20" class="mono" font-size="10.5" font-weight="700" fill="#00f7ff">Catalog &amp; Pricing</text>
        <text x="10" y="38" class="sans" font-size="9.5" fill="#edfdf6">Tiered Pricing</text>
        <text x="10" y="54" class="sans" font-size="9" fill="#8e9d97">Customer Price Bands</text>
        <text x="10" y="70" class="sans" font-size="9" fill="#8e9d97">SKU Variations</text>
        <text x="10" y="86" class="mono" font-size="8.5" fill="#00ff9c">Cached in Redis</text>
      </g>
      <!-- Warehouse & Inventory -->
      <g transform="translate(348, 0)">
        <rect x="0" y="0" width="162" height="98" rx="4" fill="#09161a" stroke="rgba(0, 247, 255, 0.3)" stroke-width="1" />
        <text x="10" y="20" class="mono" font-size="10.5" font-weight="700" fill="#00f7ff">Warehouse Scope</text>
        <text x="10" y="38" class="sans" font-size="9.5" fill="#edfdf6">Stock Fulfillment</text>
        <text x="10" y="54" class="sans" font-size="9" fill="#8e9d97">Reservation Queue</text>
        <text x="10" y="70" class="sans" font-size="9" fill="#8e9d97">Exceptions &amp; Damage</text>
        <text x="10" y="86" class="mono" font-size="8.5" fill="#00ff9c">Audit Logging</text>
      </g>
      <!-- Delivery Dispatch -->
      <g transform="translate(522, 0)">
        <rect x="0" y="0" width="162" height="98" rx="4" fill="#09161a" stroke="rgba(0, 247, 255, 0.3)" stroke-width="1" />
        <text x="10" y="20" class="mono" font-size="10.5" font-weight="700" fill="#00f7ff">Logistics &amp; PoD</text>
        <text x="10" y="38" class="sans" font-size="9.5" fill="#edfdf6">Route Assignment</text>
        <text x="10" y="54" class="sans" font-size="9" fill="#8e9d97">Driver Confirmation</text>
        <text x="10" y="70" class="sans" font-size="9" fill="#8e9d97">Signed Proof Upload</text>
        <text x="10" y="86" class="mono" font-size="8.5" fill="#00ff9c">Presigned S3 URLs</text>
      </g>
      <!-- Financial Accounting -->
      <g transform="translate(696, 0)">
        <rect x="0" y="0" width="160" height="98" rx="4" fill="#09161a" stroke="rgba(0, 247, 255, 0.3)" stroke-width="1" />
        <text x="10" y="20" class="mono" font-size="10.5" font-weight="700" fill="#00f7ff">Finance &amp; Ledger</text>
        <text x="10" y="38" class="sans" font-size="9.5" fill="#edfdf6">Double-Entry Journal</text>
        <text x="10" y="54" class="sans" font-size="9" fill="#8e9d97">Receivables Aging</text>
        <text x="10" y="70" class="sans" font-size="9" fill="#8e9d97">Tax Invoices (PDF)</text>
        <text x="10" y="86" class="mono" font-size="8.5" fill="#00ff9c">Payment Reconcile</text>
      </g>
    </g>
  </g>

  <!-- Connectors from Core to Storage -->
  <line x1="220" y1="376" x2="220" y2="408" stroke="#00f7ff" stroke-width="1.5" marker-end="url(#arrowCyan)" />
  <line x1="478" y1="376" x2="478" y2="408" stroke="#00f7ff" stroke-width="1.5" marker-end="url(#arrowCyan)" />
  <line x1="736" y1="376" x2="736" y2="408" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowViolet)" />

  <!-- LAYER 3: STORAGE & INFRASTRUCTURE (Bottom) -->
  <g transform="translate(36, 414)">
    <rect x="0" y="0" width="888" height="114" rx="6" fill="url(#panelGrad)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1" />
    <text x="16" y="22" class="mono" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="0.1em">
      03 · PERSISTENCE &amp; CLOUD INFRASTRUCTURE
    </text>

    <g transform="translate(16, 32)">
      <!-- PostgreSQL 18 -->
      <g>
        <rect x="0" y="0" width="270" height="66" rx="4" fill="#110d1c" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
        <text x="12" y="20" class="mono" font-size="11" font-weight="700" fill="#a78bfa">PostgreSQL 18</text>
        <text x="12" y="38" class="sans" font-size="10" fill="#edfdf6">Transactional Core Truth</text>
        <text x="12" y="54" class="sans" font-size="9" fill="#8e9d97">Strict Foreign Keys · Isolation Levels</text>
      </g>
      <!-- Redis 7 -->
      <g transform="translate(292, 0)">
        <rect x="0" y="0" width="270" height="66" rx="4" fill="#110d1c" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
        <text x="12" y="20" class="mono" font-size="11" font-weight="700" fill="#a78bfa">Redis 7 (Predis)</text>
        <text x="12" y="38" class="sans" font-size="10" fill="#edfdf6">Queues &amp; Ephemeral Cache</text>
        <text x="12" y="54" class="sans" font-size="9" fill="#8e9d97">Session Storage · Asynchronous Jobs</text>
      </g>
      <!-- Amazon S3 -->
      <g transform="translate(584, 0)">
        <rect x="0" y="0" width="272" height="66" rx="4" fill="#110d1c" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
        <text x="12" y="20" class="mono" font-size="11" font-weight="700" fill="#a78bfa">Amazon S3 Storage</text>
        <text x="12" y="38" class="sans" font-size="10" fill="#edfdf6">Private Document Bucket</text>
        <text x="12" y="54" class="sans" font-size="9" fill="#8e9d97">Signed PoD Photos · Generated Invoices</text>
      </g>
    </g>
  </g>
</svg>
