<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#080c0b" />
      <stop offset="100%" stop-color="#040605" />
    </linearGradient>

    <linearGradient id="consoleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1410" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#060908" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="mintCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9c" />
      <stop offset="100%" stop-color="#00f7ff" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 255, 156, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .mint { fill: #00ff9c; }
    .cyan { fill: #00f7ff; }
    .violet { fill: #8b5cf6; }
    .ink { fill: #edfdf6; }
    .muted { fill: #8e9d97; }
    .dim { fill: #3a4d46; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#bgGrad)" />
  <rect width="1200" height="300" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1198" height="298" fill="none" stroke="rgba(0, 255, 156, 0.2)" stroke-width="1.5" />
  
  <!-- Corner Tech Brackets -->
  <path d="M 2 24 L 2 2 L 24 2" fill="none" stroke="#00ff9c" stroke-width="2" />
  <path d="M 1198 24 L 1198 2 L 1176 2" fill="none" stroke="#00ff9c" stroke-width="2" />
  <path d="M 2 276 L 2 298 L 24 298" fill="none" stroke="#00ff9c" stroke-width="2" />
  <path d="M 1198 276 L 1198 298 L 1176 298" fill="none" stroke="#00ff9c" stroke-width="2" />

  <!-- LEFT COLUMN: Identity & Bio -->
  <g transform="translate(56, 42)">
    <!-- Brand Monogram AB/ and Terminal Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="56" height="28" rx="4" fill="#0c1a14" stroke="rgba(0, 255, 156, 0.4)" stroke-width="1" />
      <text x="10" y="19" class="mono" font-size="14" font-weight="900" fill="#edfdf6" letter-spacing="-1">AB<tspan fill="#00ff9c">/</tspan></text>
      
      <!-- System Status Pill -->
      <g transform="translate(72, 0)">
        <rect x="0" y="0" width="220" height="28" rx="4" fill="rgba(0, 255, 156, 0.06)" stroke="rgba(0, 255, 156, 0.2)" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#00ff9c" filter="url(#softGlow)" />
        <text x="26" y="18" class="mono" font-size="10.5" font-weight="700" fill="#00ff9c" letter-spacing="0.1em">SYSTEMS ONLINE · B.TECH 2026</text>
      </g>
    </g>

    <!-- Main Title: ANGULA BADRINATH -->
    <text x="0" y="78" class="sans" font-size="42" font-weight="900" fill="#edfdf6" letter-spacing="-0.04em">
      ANGULA <tspan fill="#00ff9c">BADRINATH</tspan>
    </text>

    <!-- Role Headline -->
    <g transform="translate(0, 108)">
      <text x="0" y="0" class="mono" font-size="13" font-weight="700" fill="#00f7ff" letter-spacing="0.12em">
        SOFTWARE ENGINEER <tspan fill="rgba(180, 255, 230, 0.3)">/</tspan> FULL-STACK <tspan fill="rgba(180, 255, 230, 0.3)">/</tspan> AI APPLICATIONS
      </text>
    </g>

    <!-- Descriptive Engineering Statement -->
    <text x="0" y="142" class="sans" font-size="14.5" fill="#8e9d97" font-weight="400">
      Building reliable software for real-world operations — from modular architectures,
    </text>
    <text x="0" y="164" class="sans" font-size="14.5" fill="#8e9d97" font-weight="400">
      responsive UI, and REST APIs to relational databases, async queues, and cloud delivery.
    </text>

    <!-- Status Badges Strip -->
    <g transform="translate(0, 192)">
      <!-- Availability Badge -->
      <g>
        <rect x="0" y="0" width="186" height="26" rx="3" fill="#082419" stroke="#00ff9c" stroke-width="1" />
        <polygon points="12,13 16,9 16,17" fill="#00ff9c" />
        <text x="24" y="17" class="mono" font-size="10" font-weight="700" fill="#00ff9c" letter-spacing="0.06em">OPEN TO FULL-TIME ROLES</text>
      </g>

      <!-- Focus Tags -->
      <g transform="translate(196, 0)">
        <rect x="0" y="0" width="112" height="26" rx="3" fill="#0a1215" stroke="rgba(0, 247, 255, 0.25)" stroke-width="1" />
        <text x="12" y="17" class="mono" font-size="10" font-weight="600" fill="#00f7ff" letter-spacing="0.05em">FASTAPI · REACT</text>
      </g>

      <g transform="translate(318, 0)">
        <rect x="0" y="0" width="130" height="26" rx="3" fill="#110d1c" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
        <text x="12" y="17" class="mono" font-size="10" font-weight="600" fill="#a78bfa" letter-spacing="0.05em">LARAVEL · DOCKER</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Interactive Terminal Card (profile.ts inspired) -->
  <g transform="translate(680, 36)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="464" height="228" rx="8" fill="url(#consoleGrad)" stroke="rgba(0, 255, 156, 0.24)" stroke-width="1.2" />
    
    <!-- Top Console Bar -->
    <rect x="0" y="0" width="464" height="34" rx="8" fill="#080e0c" />
    <path d="M 0 34 L 464 34" stroke="rgba(180, 255, 230, 0.15)" stroke-width="1" />
    
    <!-- Window Control Dots -->
    <circle cx="20" cy="17" r="4.5" fill="#ff5f56" />
    <circle cx="36" cy="17" r="4.5" fill="#ffbd2e" />
    <circle cx="52" cy="17" r="4.5" fill="#27c93f" />

    <!-- File Tab Title -->
    <text x="76" y="21" class="mono" font-size="11" fill="#8e9d97">profile.ts</text>
    
    <!-- Top Right Status -->
    <text x="444" y="21" text-anchor="end" class="mono" font-size="10" fill="#00ff9c">28.6139° N</text>

    <!-- Code Block Content -->
    <g transform="translate(20, 54)">
      <!-- Line 01 -->
      <text x="0" y="18" class="mono" font-size="12" fill="#3a4d46">01</text>
      <text x="32" y="18" class="mono" font-size="12" fill="#8b5cf6">const</text>
      <text x="74" y="18" class="mono" font-size="12" fill="#edfdf6">engineer</text>
      <text x="138" y="18" class="mono" font-size="12" fill="#00ff9c">=</text>
      <text x="152" y="18" class="mono" font-size="12" fill="#edfdf6">{</text>

      <!-- Line 02 -->
      <text x="0" y="38" class="mono" font-size="12" fill="#3a4d46">02</text>
      <text x="44" y="38" class="mono" font-size="12" fill="#8e9d97">name:</text>
      <text x="88" y="38" class="mono" font-size="12" fill="#00ff9c">"Angula Badrinath"</text>
      <text x="236" y="38" class="mono" font-size="12" fill="#8e9d97">,</text>

      <!-- Line 03 -->
      <text x="0" y="58" class="mono" font-size="12" fill="#3a4d46">03</text>
      <text x="44" y="58" class="mono" font-size="12" fill="#8e9d97">role:</text>
      <text x="88" y="58" class="mono" font-size="12" fill="#00f7ff">"Full-Stack / AI Systems"</text>
      <text x="290" y="58" class="mono" font-size="12" fill="#8e9d97">,</text>

      <!-- Line 04 -->
      <text x="0" y="78" class="mono" font-size="12" fill="#3a4d46">04</text>
      <text x="44" y="78" class="mono" font-size="12" fill="#8e9d97">core:</text>
      <text x="88" y="78" class="mono" font-size="12" fill="#edfdf6">[</text>
      <text x="96" y="78" class="mono" font-size="12" fill="#00ff9c">"React"</text>
      <text x="148" y="78" class="mono" font-size="12" fill="#8e9d97">,</text>
      <text x="160" y="78" class="mono" font-size="12" fill="#00ff9c">"FastAPI"</text>
      <text x="230" y="78" class="mono" font-size="12" fill="#8e9d97">,</text>
      <text x="242" y="78" class="mono" font-size="12" fill="#00ff9c">"Laravel"</text>
      <text x="312" y="78" class="mono" font-size="12" fill="#edfdf6">],</text>

      <!-- Line 05 -->
      <text x="0" y="98" class="mono" font-size="12" fill="#3a4d46">05</text>
      <text x="44" y="98" class="mono" font-size="12" fill="#8e9d97">shipping:</text>
      <text x="118" y="98" class="mono" font-size="12" fill="#8b5cf6">true</text>
      <text x="148" y="98" class="mono" font-size="12" fill="#8e9d97">,</text>

      <!-- Line 06 -->
      <text x="0" y="118" class="mono" font-size="12" fill="#3a4d46">06</text>
      <text x="32" y="118" class="mono" font-size="12" fill="#edfdf6">};</text>
    </g>

    <!-- Console Footer -->
    <rect x="0" y="194" width="464" height="34" rx="0" fill="#050a08" />
    <path d="M 0 194 L 464 194" stroke="rgba(180, 255, 230, 0.12)" stroke-width="1" />
    <circle cx="20" cy="211" r="3" fill="#00ff9c" />
    <text x="30" y="214" class="mono" font-size="10.5" fill="#00ff9c" letter-spacing="0.08em">COMPILATION: SUCCESS (0 ERRORS)</text>
    <text x="444" y="214" text-anchor="end" class="mono" font-size="10.5" fill="#8e9d97">ZSH · 80x24</text>
  </g>
</svg>
