name: Generate Contribution Snake Animation

'on':
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  generate-snake:
    name: Generate Snake Grid
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate contribution snake SVG
        # Pinned to v3.5.0 commit SHA
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: AngulaBadrinath
          outputs: assets/generated/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00ff9c&color_dots=#0a0d0d,#0b2b1d,#00703c,#00b865,#00ff9c

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/github-contribution-grid-snake.svg
          if git diff --staged --quiet; then
            echo "No changes in contribution snake SVG; skipping commit."
          else
            git commit -m "chore(snake): update contribution grid animation [skip ci]"
            git push
          fi

